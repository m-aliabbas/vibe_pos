name: Windows Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      NODE_VERSION: "20.19.5"
      PYTHON_VERSION: "3.12.10"
      RUST_VERSION: "1.88.0"
      RELEASE_REPOSITORY: "m-aliabbas/vibepos-releases"

    steps:
      - name: Check out the private repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements-windows.lock

      - name: Set up the pinned Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install $env:RUST_VERSION --profile minimal
          rustup default $env:RUST_VERSION
          rustc --version
          cargo --version

      - name: Validate the release version
        working-directory: frontend
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: node scripts/check-release-version.mjs $env:RELEASE_TAG

      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install locked backend dependencies
        working-directory: backend
        shell: pwsh
        run: python -m pip install --disable-pip-version-check --requirement requirements-windows.lock

      - name: Restore protected Tauri bundle inputs
        shell: pwsh
        env:
          TAURI_ENV_FILE_BASE64: ${{ secrets.TAURI_ENV_FILE_BASE64 }}
          TAURI_DATA_ARCHIVE_BASE64: ${{ secrets.TAURI_DATA_ARCHIVE_BASE64 }}
        run: |
          $binDir = Join-Path $env:GITHUB_WORKSPACE "frontend\src-tauri\bin"
          $dataDir = Join-Path $binDir "data"
          New-Item -ItemType Directory -Force -Path $dataDir | Out-Null

          if ([string]::IsNullOrWhiteSpace($env:TAURI_ENV_FILE_BASE64)) {
            throw "Repository secret TAURI_ENV_FILE_BASE64 is required. See WINDOWS_RELEASE.md."
          }

          [IO.File]::WriteAllBytes(
            (Join-Path $binDir ".env"),
            [Convert]::FromBase64String($env:TAURI_ENV_FILE_BASE64)
          )

          if (-not [string]::IsNullOrWhiteSpace($env:TAURI_DATA_ARCHIVE_BASE64)) {
            $archive = Join-Path $env:RUNNER_TEMP "tauri-data.zip"
            [IO.File]::WriteAllBytes(
              $archive,
              [Convert]::FromBase64String($env:TAURI_DATA_ARCHIVE_BASE64)
            )
            Expand-Archive -LiteralPath $archive -DestinationPath $dataDir -Force
            Remove-Item -LiteralPath $archive -Force
          }

      - name: Check the backend source
        run: python -m compileall -q backend/app backend/run_server.py

      - name: Report existing frontend lint findings
        continue-on-error: true
        working-directory: frontend
        run: npm run lint

      - name: Build the Windows backend sidecar
        shell: pwsh
        run: ./backend/build_windows.ps1 -SkipInstall

      - name: Build the NSIS installer
        working-directory: frontend
        run: npm run tauri:build -- --bundles nsis

      - name: Confirm lock files did not change
        shell: pwsh
        run: |
          git diff -- frontend/package-lock.json frontend/src-tauri/Cargo.lock
          git diff --exit-code -- frontend/package-lock.json frontend/src-tauri/Cargo.lock
          if ($LASTEXITCODE -ne 0) {
            throw "The build changed a lock file. Commit the dependency update separately."
          }

      - name: Upload changed lock files for diagnosis
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: changed-lock-files-${{ github.run_number }}
          path: |
            frontend/package-lock.json
            frontend/src-tauri/Cargo.lock
          if-no-files-found: error
          retention-days: 7

      - name: Create the build record and checksums
        shell: pwsh
        run: |
          $releaseDir = Join-Path $env:GITHUB_WORKSPACE "release\windows"
          New-Item -ItemType Directory -Force -Path $releaseDir | Out-Null

          $installer = Get-ChildItem "frontend\src-tauri\target\release\bundle\nsis\*-setup.exe" | Select-Object -First 1
          if (-not $installer) {
            throw "The NSIS installer was not produced."
          }

          $package = Get-Content "frontend\package.json" -Raw | ConvertFrom-Json
          $installerName = "VibePOS_$($package.version)_x64-setup.exe"
          $copiedInstaller = Join-Path $releaseDir $installerName
          Copy-Item -LiteralPath $installer.FullName -Destination $copiedInstaller -Force
          $installerHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $copiedInstaller).Hash.ToLowerInvariant()
          "$installerHash  $installerName" | Set-Content -Encoding ascii (Join-Path $releaseDir "SHA256SUMS.txt")

          $record = [ordered]@{
            application = "VibePOS"
            version = $package.version
            commit = $env:GITHUB_SHA
            source_ref = $env:GITHUB_REF
            workflow_run = $env:GITHUB_RUN_ID
            built_at_utc = (Get-Date).ToUniversalTime().ToString("o")
            runner = "windows-2022"
            node = (& node --version).Trim()
            npm = (& npm --version).Trim()
            python = (& python --version).Trim()
            rustc = (& rustc --version).Trim()
            cargo = (& cargo --version).Trim()
            npm_lock_sha256 = (Get-FileHash -Algorithm SHA256 "frontend\package-lock.json").Hash.ToLowerInvariant()
            python_lock_sha256 = (Get-FileHash -Algorithm SHA256 "backend\requirements-windows.lock").Hash.ToLowerInvariant()
            cargo_lock_sha256 = (Get-FileHash -Algorithm SHA256 "frontend\src-tauri\Cargo.lock").Hash.ToLowerInvariant()
            installer = $installerName
            installer_sha256 = $installerHash
            signed = $false
          }
          $record | ConvertTo-Json | Set-Content -Encoding utf8 (Join-Path $releaseDir "build-manifest.json")
          python -m pip freeze | Set-Content -Encoding utf8 (Join-Path $releaseDir "python-packages.txt")

          $tag = "v$($package.version)"
          $releaseUrl = "https://github.com/$env:RELEASE_REPOSITORY/releases/tag/$tag"
          $downloadUrl = "https://github.com/$env:RELEASE_REPOSITORY/releases/download/$tag/$installerName"
          $releaseNotes = (git log -1 --pretty=%s).Trim()
          if ([string]::IsNullOrWhiteSpace($releaseNotes)) {
            $releaseNotes = "VibePOS $tag"
          }
          $manifest = [ordered]@{
            schema_version = 1
            version = $package.version
            published_at = (Get-Date).ToUniversalTime().ToString("o")
            notes = $releaseNotes
            release_url = $releaseUrl
            downloads = [ordered]@{
              "windows-x86_64" = [ordered]@{
                url = $downloadUrl
                sha256 = $installerHash
                size = (Get-Item -LiteralPath $copiedInstaller).Length
              }
            }
          }
          $manifest | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 (Join-Path $releaseDir "latest.json")

      - name: Upload the Windows build artifact
        uses: actions/upload-artifact@v7
        with:
          name: VibePOS-Windows-${{ github.run_number }}
          path: release/windows/*
          if-no-files-found: error
          retention-days: 90

      - name: Publish the customer release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $assets = Get-ChildItem "release\windows\*" | ForEach-Object { $_.FullName }
          $manifest = Get-Content "release\windows\latest.json" -Raw | ConvertFrom-Json

          if ([string]::IsNullOrWhiteSpace($env:GH_TOKEN)) {
            throw "Repository secret RELEASE_REPO_TOKEN is required to publish customer releases."
          }

          & gh release view $tag --repo $env:RELEASE_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            & gh release upload $tag @assets --clobber --repo $env:RELEASE_REPOSITORY
            if ($LASTEXITCODE -eq 0) {
              & gh release edit $tag --repo $env:RELEASE_REPOSITORY --latest --title "VibePOS $tag" --notes $manifest.notes
            }
          } else {
            & gh release create $tag @assets --repo $env:RELEASE_REPOSITORY --latest --title "VibePOS $tag" --notes $manifest.notes
          }
          if ($LASTEXITCODE -ne 0) {
            throw "Publishing the customer release failed."
          }
