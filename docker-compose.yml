services:
  postgres:
    image: postgres:16-alpine
    container_name: vibepos_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: vibepos
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    ports:
      - "5432:5432"
    volumes:
      - vibepos_pgdata:/var/lib/postgresql/data

volumes:
  vibepos_pgdata:
